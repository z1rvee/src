name: Build iOSTweak (ESP)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Theos
        run: |
          set -e
          export THEOS="$HOME/theos"
          if [ ! -d "$THEOS" ]; then
            git clone --recursive https://github.com/theos/theos.git "$THEOS"
          fi
          mkdir -p "$THEOS/bin"
          if ! command -v ldid >/dev/null 2>&1; then
            curl -sSL https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_arm64 -o "$THEOS/bin/ldid" 2>/dev/null || true
            chmod +x "$THEOS/bin/ldid" 2>/dev/null || true
          fi

      - name: Prepare SkinLua.h and ensure meenu.mm exists
        run: |
          set -e
          if [ -f Skin.lua ]; then
            python3 -c 'data = open("Skin.lua","rb").read(); open("SkinLua.h","w").write("static const unsigned char Skin_lua[] = {" + ",".join(str(b) for b in data) + "};\nstatic const unsigned int Skin_lua_len = " + str(len(data)) + ";\n")'
          else
            printf "static const unsigned char Skin_lua[] = {0x2d,0x2d,0x20,0x65,0x6d,0x70,0x74,0x79};\nstatic const unsigned int Skin_lua_len = 8;\n" > SkinLua.h
          fi

          if [ ! -f meenu.mm ]; then
            cat << 'EOF' > meenu.mm
          #import <UIKit/UIKit.h>
          #import <Foundation/Foundation.h>
          #include "SkinLua.h"

          extern bool MenDeal;

          static NSString *RunSkinLuaScript(void) {
              NSData *raw = [NSData dataWithBytes:Skin_lua length:Skin_lua_len];
              NSString *script = [[NSString alloc] initWithData:raw encoding:NSUTF8StringEncoding];
              if (!script || script.length == 0) {
                  return @"Skin.lua boşdur";
              }
              return [NSString stringWithFormat:@"Skin.lua yükləndi (%lu bayt)", (unsigned long)raw.length];
          }

          @interface MeenuOverlayController : NSObject
          @property (nonatomic, strong) UIButton *blackCircleButton;
          @property (nonatomic, strong) UIView *meenuPopup;
          @property (nonatomic, strong) UILabel *statusLabel;
          - (void)handleBlackCircleTap;
          - (void)openMeenuWindow;
          - (void)closeMeenuWindow;
          - (void)runSkinLuaAction;
          @end

          static MeenuOverlayController *gMeenuOverlay = nil;

          @implementation MeenuOverlayController

          - (instancetype)init {
              self = [super init];
              if (self) {
                  [[NSNotificationCenter defaultCenter] addObserver:self
                                                           selector:@selector(openMeenuWindow)
                                                               name:@"MeenuOpenRequested"
                                                             object:nil];
              }
              return self;
          }

          - (UIWindow *)activeWindow {
              for (UIWindowScene *scene in [UIApplication sharedApplication].connectedScenes) {
                  if (scene.activationState == UISceneActivationStateForegroundActive) {
                      for (UIWindow *w in scene.windows) {
                          if (w.isKeyWindow) return w;
                      }
                      if (scene.windows.firstObject) return scene.windows.firstObject;
                  }
              }
              return [UIApplication sharedApplication].windows.firstObject;
          }

          - (void)handleBlackCircleTap {
              MenDeal = !MenDeal;
          }

          - (void)runSkinLuaAction {
              self.statusLabel.text = RunSkinLuaScript();
              self.statusLabel.textColor = [UIColor colorWithRed:0.85 green:0.85 blue:0.85 alpha:1.0];
          }

          - (void)openMeenuWindow {
              UIWindow *win = [self activeWindow];
              if (!win) return;

              if (!self.meenuPopup) {
                  UIView *box = [[UIView alloc] initWithFrame:CGRectMake(32, 114, 240, 134)];
                  box.backgroundColor = [UIColor colorWithRed:0.04 green:0.04 blue:0.04 alpha:0.96];
                  box.layer.cornerRadius = 10;
                  box.layer.borderWidth = 1.0;
                  box.layer.borderColor = [UIColor colorWithWhite:0.18 alpha:1.0].CGColor;

                  UILabel *title = [[UILabel alloc] initWithFrame:CGRectMake(14, 12, 160, 20)];
                  title.text = @"MEENU";
                  title.textColor = [UIColor whiteColor];
                  title.font = [UIFont boldSystemFontOfSize:13];
                  [box addSubview:title];

                  UIButton *closeBtn = [UIButton buttonWithType:UIButtonTypeSystem];
                  closeBtn.frame = CGRectMake(196, 8, 34, 28);
                  [closeBtn setTitle:@"X" forState:UIControlStateNormal];
                  [closeBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
                  closeBtn.titleLabel.font = [UIFont boldSystemFontOfSize:13];
                  [closeBtn addTarget:self action:@selector(closeMeenuWindow) forControlEvents:UIControlEventTouchUpInside];
                  [box addSubview:closeBtn];

                  UIButton *runBtn = [UIButton buttonWithType:UIButtonTypeSystem];
                  runBtn.frame = CGRectMake(14, 44, 212, 36);
                  runBtn.backgroundColor = [UIColor colorWithWhite:0.12 alpha:1.0];
                  runBtn.layer.cornerRadius = 6;
                  [runBtn setTitle:@"RUN SKIN.LUA" forState:UIControlStateNormal];
                  [runBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
                  runBtn.titleLabel.font = [UIFont boldSystemFontOfSize:12];
                  [runBtn addTarget:self action:@selector(runSkinLuaAction) forControlEvents:UIControlEventTouchUpInside];
                  [box addSubview:runBtn];

                  UILabel *status = [[UILabel alloc] initWithFrame:CGRectMake(14, 90, 212, 30)];
                  status.text = @"Hazırdır";
                  status.textColor = [UIColor colorWithWhite:0.55 alpha:1.0];
                  status.font = [UIFont systemFontOfSize:11];
                  status.numberOfLines = 2;
                  [box addSubview:status];
                  self.statusLabel = status;

                  self.meenuPopup = box;
              }

              if (!self.meenuPopup.superview) {
                  [win addSubview:self.meenuPopup];
              }
              [win bringSubviewToFront:self.meenuPopup];
              if (self.blackCircleButton) {
                  [win bringSubviewToFront:self.blackCircleButton];
              }
          }

          - (void)closeMeenuWindow {
              [self.meenuPopup removeFromSuperview];
          }

          - (void)attachCircle {
              UIWindow *win = [self activeWindow];
              if (!win) {
                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(1.5 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                      [self attachCircle];
                  });
                  return;
              }

              if (!self.blackCircleButton) {
                  CGFloat size = 48.0;
                  UIButton *btn = [UIButton buttonWithType:UIButtonTypeCustom];
                  btn.frame = CGRectMake(24.0, 56.0, size, size);
                  btn.backgroundColor = [UIColor colorWithRed:0.0 green:0.0 blue:0.0 alpha:0.70];
                  btn.layer.cornerRadius = size * 0.5;
                  btn.layer.borderWidth = 0.0;
                  btn.clipsToBounds = YES;
                  [btn addTarget:self action:@selector(handleBlackCircleTap) forControlEvents:UIControlEventTouchUpInside];
                  self.blackCircleButton = btn;
              }

              if (!self.blackCircleButton.superview) {
                  [win addSubview:self.blackCircleButton];
              }
              [win bringSubviewToFront:self.blackCircleButton];
          }

          @end

          extern "C" void OpenMeenu(void) {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (!gMeenuOverlay) {
                      gMeenuOverlay = [[MeenuOverlayController alloc] init];
                  }
                  [gMeenuOverlay openMeenuWindow];
              });
          }

          __attribute__((constructor))
          static void initMeenuOverlay(void) {
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(2.0 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                  if (!gMeenuOverlay) {
                      gMeenuOverlay = [[MeenuOverlayController alloc] init];
                  }
                  [gMeenuOverlay attachCircle];
              });
          }
          EOF
          fi

      - name: Write Makefile and control
        run: |
          set -e
          cat << 'EOF' > Makefile
          export THEOS ?= $(HOME)/theos
          THEOS_MAKE_PATH ?= $(THEOS)/makefiles

          THEOS_DEVICE_IP = 127.0.0.1
          ARCHS = arm64
          TARGET = iphone:clang:latest:15.0

          INSTALL_TARGET_PROCESSES = ShadowTrackerExtra

          include $(THEOS)/makefiles/common.mk

          TWEAK_NAME = ESP

          SDK_CPP_FILES = $(wildcard SDK/*.cpp SDK/*/*.cpp)
          SDK_MM_FILES  = $(wildcard SDK/*.mm SDK/*/*.mm)

          ESP_FILES = Engine.mm \
                      Esp.mm \
                      Menu.mm \
                      meenu.mm \
                      $(SDK_CPP_FILES) \
                      $(SDK_MM_FILES) \
                      ESP/HeeeNoScreenShotView.m \
                      ESP/HideFunsion.m \
                      ESP/PubgLoad.mm \
                      ESP/ini_rw.cpp \
                      ESP/imgui/Tools.cpp \
                      ESP/imgui/imgui.cpp \
                      ESP/imgui/imgui_draw.cpp \
                      ESP/imgui/imgui_impl_metal.mm \
                      ESP/imgui/imgui_tables.cpp \
                      ESP/imgui/imgui_widgets.cpp

          ESP_CFLAGS = -fobjc-arc -w -I. -IESP -IESP/imgui -ISDK
          ESP_CCFLAGS = -std=c++17 -fno-rtti -fno-exceptions -w -I. -IESP -IESP/imgui -ISDK

          ESP_FRAMEWORKS = UIKit Foundation Metal MetalKit QuartzCore CoreGraphics CoreText Security AVFoundation
          ESP_LIBRARIES = c++ z

          include $(THEOS)/makefiles/tweak.mk
          EOF

          if [ ! -f control ] && [ ! -f layout/DEBIAN/control ]; then
            cat << 'EOF' > control
          Package: com.esp.tweak
          Name: ESP
          Version: 1.0.0
          Architecture: iphoneos-arm64
          Description: iOS Tweak
          Maintainer: Developer
          Author: Developer
          Section: Tweaks
          EOF
          fi

      - name: Build tweak with Theos
        run: |
          set -e
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          make clean || true
          make package FINALPACKAGE=1

      - name: Collect built outputs
        run: |
          set -e
          rm -rf release_out
          mkdir -p release_out

          find . -path "./.theos/*" -name "ESP.dylib" -exec cp -f {} release_out/ \; 2>/dev/null || true
          find . -maxdepth 4 -name "ESP.dylib" -exec cp -f {} release_out/ \; 2>/dev/null || true
          find . -maxdepth 4 -name "*.deb" -exec cp -f {} release_out/ \; 2>/dev/null || true

          if [ -z "$(ls -A release_out)" ]; then
            echo "No built .dylib or .deb found in output"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESP-iOS-Build
          path: release_out/
          if-no-files-found: error
