name: Build ESP dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          set -e
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          mkdir -p $HOME/theos/sdks

          SDK_URL="https://github.com/theos/sdks/archive/refs/heads/master.zip"
          curl -fSL --retry 3 --retry-delay 2 "$SDK_URL" -o /tmp/sdks.zip
          unzip -q /tmp/sdks.zip -d /tmp/sdks_extracted
          cp -R /tmp/sdks_extracted/sdks-master/*.sdk "$HOME/theos/sdks/" || true
          ls -la "$HOME/theos/sdks"
          rm -rf /tmp/sdks.zip /tmp/sdks_extracted

      - name: Install ldid
        run: |
          brew install ldid

      - name: Build ESP dylib
        env:
          THEOS: ${{ runner.home }}/theos
        run: |
          set -e
          mkdir -p output
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless || make FINALPACKAGE=1
          DYLIB_PATH=$(find .theos/obj -name "ESP.dylib" | head -n 1)
          if [ -z "$DYLIB_PATH" ]; then
            echo "ESP.dylib bulunamadi!"
            exit 1
          fi
          ldid -S "$DYLIB_PATH"
          cp "$DYLIB_PATH" output/ESP.dylib

      - name: Upload ESP dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESP-dylib
          path: output/ESP.dylib
