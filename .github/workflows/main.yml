name: Build ESP dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          mkdir -p $HOME/theos/sdks
          curl -fSL https://github.com/xybp888/iOS-SDKs/releases/download/iOS-SDKs/iPhoneOS16.5.sdk.tar.xz -o /tmp/sdk.tar.xz
          file /tmp/sdk.tar.xz
          tar -xJf /tmp/sdk.tar.xz -C $HOME/theos/sdks
          rm -f /tmp/sdk.tar.xz

      - name: Install ldid
        run: |
          brew install ldid

      - name: Build ESP dylib
        env:
          THEOS: ${{ runner.home }}/theos
        run: |
          mkdir -p output
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless || make FINALPACKAGE=1
          DYLIB_PATH=$(find .theos/obj -name "ESP.dylib" | head -n 1)
          if [ -z "$DYLIB_PATH" ]; then
            echo "ESP.dylib tapılmadı!"
            exit 1
          fi
          ldid -S "$DYLIB_PATH"
          cp "$DYLIB_PATH" output/ESP.dylib

      - name: Upload ESP dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESP-dylib
          path: output/ESP.dylib
